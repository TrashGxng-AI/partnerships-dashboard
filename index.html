<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trash Gxng — Partnerships KPI Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --canvas:   #060D1A;
      --card:     #0C1628;
      --card-h:   #0F1D34;
      --cyan:     #00C2CB;
      --white:    #E8F0FF;
      --muted:    #6B80A0;
      --border:   rgba(0,194,203,0.12);
      --border-h: rgba(0,194,203,0.35);
      --g:        #34D27A;
      --a:        #F0B429;
      --r:        #E05252;
      --gr:       #4A5568;
      --s-blue:   #2196F3;
      --s-purple: #9C27B0;
      --s-green:  #4CAF50;
      --s-orange: #FF7043;
      --s-grey:   #607D8B;
      --radius:   6px;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--canvas);
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,194,203,0.07) 0%, transparent 60%);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px; line-height: 1.5; min-height: 100vh;
    }

    /* TOP BAR */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(6,13,26,0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 52px;
    }
    .wordmark { font-weight: 700; font-size: 17px; letter-spacing: 0.06em; color: var(--white); }
    .wordmark em { color: var(--cyan); font-style: normal; text-shadow: 0 0 12px rgba(0,194,203,0.5); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      background: rgba(0,194,203,0.06); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--muted); cursor: pointer; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: all 0.2s; text-decoration: none;
    }
    .icon-btn:hover { border-color: var(--border-h); color: var(--cyan); box-shadow: 0 0 8px rgba(0,194,203,0.15); }
    .topbar-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,194,203,0.06); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px;
      font-size: 13px; font-weight: 500; color: var(--muted);
    }
    .topbar-pill span { color: var(--cyan); font-weight: 600; }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--g);
      box-shadow: 0 0 6px var(--g); animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* PAGE HEADER */
    .page-header {
      padding: 28px 24px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
    }
    .eyebrow {
      display: flex; align-items: center; gap: 8px;
      font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--cyan); margin-bottom: 10px;
    }
    .eyebrow::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--cyan); opacity: 0.6; }
    .page-h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; color: var(--white); }
    .page-sub { font-size: 15px; color: var(--muted); margin-top: 6px; }
    .person-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), #0077FF);
      color: #000; font-weight: 700; font-size: 11px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .person-name { font-size: 15px; font-weight: 600; color: var(--white); }
    .person-role { font-size: 13px; color: var(--muted); margin-top: 1px; }
    .stat-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .stat-chip {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 13px; font-size: 13px; font-weight: 500; color: var(--muted);
    }
    .stat-chip b { font-size: 15px; font-weight: 700; color: var(--white); }
    .pip { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-top: 4px; }
    .seg-toggle {
      display: flex; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    }
    .seg-btn {
      background: none; border: none; font-family: 'Space Grotesk', sans-serif;
      font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted); cursor: pointer; padding: 8px 18px; transition: all 0.15s;
    }
    .seg-btn.active { background: var(--cyan); color: #000; box-shadow: 0 0 12px rgba(0,194,203,0.3); }
    .seg-btn:not(.active):hover { color: var(--white); background: rgba(255,255,255,0.04); }
    .week-nav {
      display: flex; align-items: center; gap: 4px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.03); border-radius: var(--radius); padding: 4px 8px;
    }
    .week-nav button {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 14px; line-height: 1; padding: 2px 4px; transition: color 0.15s;
    }
    .week-nav button:hover:not(:disabled) { color: var(--cyan); }
    .week-nav button:disabled { opacity: 0.25; cursor: default; }
    .week-nav span {
      font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500;
      color: var(--white); min-width: 70px; text-align: center;
    }

    /* CONTENT */
    .content { max-width: 1320px; margin: 0 auto; padding: 28px 24px 56px; }

    /* HEALTH BANNER */
    .health-banner {
      border-radius: 10px; padding: 18px 24px; margin-bottom: 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      border: 1px solid;
    }
    .health-label { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 4px; }
    .health-pct { font-size: 40px; font-weight: 700; line-height: 1; }
    .health-sub { font-size: 13px; opacity: 0.8; }

    /* SECTION */
    .section-band { margin-bottom: 36px; }
    .section-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .section-title {
      font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
      padding-bottom: 6px; border-bottom: 1px solid;
    }
    .section-count {
      font-size: 12px; font-weight: 600; color: var(--muted);
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 10px; padding: 3px 9px;
    }
    .section-freq { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 12px; color: #E8F0FF; letter-spacing: 0.1em; text-transform: uppercase; }

    /* KPI GRID */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

    /* KPI CARD */
    .kc {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 18px 16px 22px; position: relative;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s; overflow: hidden;
    }
    .kc:hover { border-color: var(--border-h); background: var(--card-h); box-shadow: 0 0 20px rgba(0,194,203,0.06), inset 0 1px 0 rgba(0,194,203,0.08); }
    .kc::after {
      content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: 0; transition: opacity 0.2s;
    }
    .kc:hover::after { opacity: 0.5; }
    .kc-bar { position: absolute; left: 0; top: 12px; bottom: 12px; width: 2px; border-radius: 0 2px 2px 0; opacity: 0.7; }
    .kc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .kc-meta { flex: 1; min-width: 0; overflow: visible; }
    .kc-id {
      font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      word-break: break-word; margin-bottom: 4px;
    }
    .kc-target { font-family: 'DM Mono', monospace; font-size: 13px; color: rgba(200,215,240,0.85); letter-spacing: 0.04em; }
    .rag {
      display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 4px 10px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      white-space: nowrap; flex-shrink: 0;
    }
    .rag-dot { font-size: 8px; }
    .rg { color: var(--g); background: rgba(52,210,122,0.08); border: 1px solid rgba(52,210,122,0.2); }
    .ra { color: var(--a); background: rgba(240,180,41,0.08); border: 1px solid rgba(240,180,41,0.2); }
    .rr { color: var(--r); background: rgba(224,82,82,0.08); border: 1px solid rgba(224,82,82,0.2); }
    .rn { color: var(--gr); background: rgba(74,85,104,0.1); border: 1px solid rgba(74,85,104,0.2); }
    .kc-hero { font-size: 46px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--white); margin-bottom: 5px; }
    .kc-hero.dim { color: rgba(255,255,255,0.12); }
    .kc-sub { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.02em; }
    .bool-yes { color: var(--g); font-weight: 600; font-size: 22px; }
    .bool-no  { color: var(--r); font-weight: 600; font-size: 22px; }
    .mo-tag {
      display: inline-block; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase; color: rgba(107,128,160,0.45);
      border: 1px solid rgba(107,128,160,0.15); border-radius: 3px; padding: 2px 6px;
      margin-left: 6px; vertical-align: middle;
    }
    .kc-foot { display: flex; align-items: flex-end; justify-content: flex-end; margin-top: 4px; }
    .spark { opacity: 0.25; transition: opacity 0.2s; }
    .kc:hover .spark { opacity: 0.9; }

    /* STATE CARDS (loading / error) */
    .state-wrap { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
    .state-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 48px 36px; text-align: center; max-width: 460px; width: 100%;
    }
    .state-icon { font-size: 40px; margin-bottom: 16px; }
    .state-title { font-size: 20px; font-weight: 700; color: var(--white); margin-bottom: 8px; }
    .state-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
    .state-btn {
      display: inline-block; background: var(--cyan); color: #000; font-weight: 700;
      font-size: 13px; padding: 10px 24px; border-radius: var(--radius);
      text-decoration: none; transition: opacity 0.2s;
    }
    .state-btn:hover { opacity: 0.85; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-ring {
      width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--cyan);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px;
    }
  </style>
</head>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ═══════════════════════════════════════════════════════════════
// CONFIG — edit these when URLs or targets change
// ═══════════════════════════════════════════════════════════════
const SHEET_CSV_URL  = "https://script.google.com/macros/s/AKfycbxCbAW3-MkKPfEUAVwde7CoS5ZD3si3Fv9IGPys-Tr8uSCn_qJGi-yADK04Ag8ozQZm/exec";
const SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/1WnyGb8BcpVVRDrUonoF0o17LKM9PoZ2A3mqflXleqI0/edit";

// Per-week targets
const TARGETS = {
  crmContacts: 2, outreachActions: 5, retailPartners: 1, linkedinContacts: 5,
  stakeholderMeetings: 2, partnershipConvos: 1, confirmedOpps: 1, featuresProgressed: 1,
  retailConvos: 1, retailTestOpps: 1, collabLeads: 1, networkingEvents: 1,
};

// Keys that accumulate week-on-week (multiplied by week count in month view)
const WEEKLY_KEYS = ['crmContacts','outreachActions','retailPartners','linkedinContacts'];

// ═══════════════════════════════════════════════════════════════
// SECTION / KPI DEFINITIONS
// ═══════════════════════════════════════════════════════════════
const SECTIONS = [
  { title:'Weekly Activity', freq:'Weekly', cv:'--s-blue', cr:'33,150,243', kpis:[
    { id:'P01', label:'CRM Contacts Added',           key:'crmContacts',      unit:'contacts' },
    { id:'P02', label:'Outreach & Follow-up Actions', key:'outreachActions',  unit:'actions'  },
    { id:'P03', label:'Retail Partners Researched',   key:'retailPartners',   unit:'partners' },
    { id:'P04', label:'LinkedIn Contacts Added',      key:'linkedinContacts', unit:'contacts' },
    { id:'P05', label:'All Contacts Logged 48hrs',    key:'allLogged',        yesNo:true      },
  ]},
  { title:'Partnerships & Stakeholders', freq:'Monthly', cv:'--s-purple', cr:'156,39,176', kpis:[
    { id:'P06', label:'Stakeholder Meetings',         key:'stakeholderMeetings', unit:'meetings', mo:true },
    { id:'P07', label:'New Partnership Convos',       key:'partnershipConvos',   unit:'convos',   mo:true },
    { id:'P08', label:'Confirmed Opps Secured',       key:'confirmedOpps',       unit:'opps',     mo:true },
    { id:'P09', label:'External Features / Speaking', key:'featuresProgressed',  unit:'opps',     mo:true },
  ]},
  { title:'Retail & Fashion', freq:'Monthly', cv:'--s-green', cr:'76,175,80', kpis:[
    { id:'P10', label:'New Active Retail Convos',   key:'retailConvos',   unit:'convos', mo:true },
    { id:'P11', label:'Retail Test Opp Progressed', key:'retailTestOpps', unit:'opps',   mo:true },
    { id:'P12', label:'Brand / Artist Collab Lead', key:'collabLeads',    unit:'leads',  mo:true },
  ]},
  { title:'External Engagement', freq:'Monthly', cv:'--s-orange', cr:'255,112,67', kpis:[
    { id:'P13', label:'Networking Events',       key:'networkingEvents', unit:'events', mo:true },
    { id:'P14', label:'LinkedIn Post Published', key:'linkedinPost',     yesNo:true,    mo:true },
  ]},
  { title:'Systems & CRM', freq:'Monthly', cv:'--s-grey', cr:'96,125,139', kpis:[
    { id:'P15', label:'Monthly Pipeline Update',     key:'pipelineUpdate',   yesNo:true, mo:true },
    { id:'P16', label:'Template Created / Improved', key:'templateImproved', yesNo:true, mo:true },
  ]},
];

// ═══════════════════════════════════════════════════════════════
// CSV PARSER
// ═══════════════════════════════════════════════════════════════
function parseCSV(text) {
  const rows = []; let row = [], cur = '', inQ = false;
  const t = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (inQ) {
      if (ch === '"') { if (t[i+1]==='"') { cur+='"'; i++; } else { inQ=false; } }
      else cur += ch;
    } else {
      if      (ch==='"')  { inQ=true; }
      else if (ch===',')  { row.push(cur.trim()); cur=''; }
      else if (ch==='\n') { row.push(cur.trim()); rows.push(row); row=[]; cur=''; }
      else cur += ch;
    }
  }
  row.push(cur.trim());
  if (row.some(c=>c!=='')) rows.push(row);
  return rows;
}

function toNum(v)  { return (v===''||v==null) ? 0 : (Number(v)||0); }
function toBool(v) { return v ? ['true','yes','1','y'].includes(String(v).toLowerCase().trim()) : false; }

function loadSheetData(text) {
  const rows = parseCSV(text);
  const dataRows = rows.slice(2).filter(r => r[0]?.trim());
  const weeks = [], data = {};
  dataRows.forEach(c => {
    const wk = c[0]?.trim(); if (!wk) return;
    weeks.push(wk);
    data[wk] = {
      crmContacts:         toNum(c[1]),   outreachActions:  toNum(c[2]),
      retailPartners:      toNum(c[3]),   linkedinContacts: toNum(c[4]),
      allLogged:           toBool(c[5]),
      stakeholderMeetings: toNum(c[6]),   partnershipConvos:  toNum(c[7]),
      confirmedOpps:       toNum(c[8]),   featuresProgressed: toNum(c[9]),
      retailConvos:        toNum(c[10]),  retailTestOpps:     toNum(c[11]),
      collabLeads:         toNum(c[12]),  networkingEvents:   toNum(c[13]),
      linkedinPost:        toBool(c[14]), pipelineUpdate:     toBool(c[15]),
      templateImproved:    toBool(c[16]),
    };
  });
  return { weeks, data };
}

// ═══════════════════════════════════════════════════════════════
// MONTH UTILITIES
// ═══════════════════════════════════════════════════════════════
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function getMonthKey(lbl) {
  const p = lbl.trim().split(' ');
  return (p.length===2 && MON.includes(p[1])) ? p[1] : null;
}

function getMonths(weeks) {
  const seen = new Set(), out = [];
  for (const w of weeks) { const m = getMonthKey(w); if (m && !seen.has(m)) { seen.add(m); out.push(m); } }
  return out;
}
