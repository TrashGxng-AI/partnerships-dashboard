<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trash Gxng — Partnerships KPI Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --canvas:   #060D1A;
      --card:     #0C1628;
      --card-h:   #0F1D34;
      --cyan:     #00C2CB;
      --white:    #E8F0FF;
      --muted:    #6B80A0;
      --border:   rgba(0,194,203,0.12);
      --border-h: rgba(0,194,203,0.35);
      --g:        #34D27A;
      --a:        #F0B429;
      --r:        #E05252;
      --gr:       #4A5568;
      --s-blue:   #2196F3;
      --s-purple: #9C27B0;
      --s-green:  #4CAF50;
      --s-orange: #FF7043;
      --s-grey:   #607D8B;
      --radius:   6px;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--canvas);
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,194,203,0.07) 0%, transparent 60%);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px; line-height: 1.5; min-height: 100vh;
    }

    /* TOP BAR */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(6,13,26,0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 52px;
    }
    .wordmark { font-weight: 700; font-size: 17px; letter-spacing: 0.06em; color: var(--white); }
    .wordmark em { color: var(--cyan); font-style: normal; text-shadow: 0 0 12px rgba(0,194,203,0.5); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      background: rgba(0,194,203,0.06); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--muted); cursor: pointer; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: all 0.2s; text-decoration: none;
    }
    .icon-btn:hover { border-color: var(--border-h); color: var(--cyan); box-shadow: 0 0 8px rgba(0,194,203,0.15); }
    .topbar-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,194,203,0.06); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px;
      font-size: 13px; font-weight: 500; color: var(--muted);
    }
    .topbar-pill span { color: var(--cyan); font-weight: 600; }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--g);
      box-shadow: 0 0 6px var(--g); animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* PAGE HEADER */
    .page-header {
      padding: 28px 24px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
    }
    .eyebrow {
      display: flex; align-items: center; gap: 8px;
      font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--cyan); margin-bottom: 10px;
    }
    .eyebrow::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--cyan); opacity: 0.6; }
    .page-h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; color: var(--white); }
    .page-sub { font-size: 15px; color: var(--muted); margin-top: 6px; }
    .person-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), #0077FF);
      color: #000; font-weight: 700; font-size: 11px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .person-name { font-size: 15px; font-weight: 600; color: var(--white); }
    .person-role { font-size: 13px; color: var(--muted); margin-top: 1px; }
    .stat-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .stat-chip {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 13px; font-size: 13px; font-weight: 500; color: var(--muted);
    }
    .stat-chip b { font-size: 15px; font-weight: 700; color: var(--white); }
    .pip { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-top: 4px; }
    .seg-toggle {
      display: flex; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    }
    .seg-btn {
      background: none; border: none; font-family: 'Space Grotesk', sans-serif;
      font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted); cursor: pointer; padding: 8px 18px; transition: all 0.15s;
    }
    .seg-btn.active { background: var(--cyan); color: #000; box-shadow: 0 0 12px rgba(0,194,203,0.3); }
    .seg-btn:not(.active):hover { color: var(--white); background: rgba(255,255,255,0.04); }
    .week-nav {
      display: flex; align-items: center; gap: 4px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.03); border-radius: var(--radius); padding: 4px 8px;
    }
    .week-nav button {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 14px; line-height: 1; padding: 2px 4px; transition: color 0.15s;
    }
    .week-nav button:hover:not(:disabled) { color: var(--cyan); }
    .week-nav button:disabled { opacity: 0.25; cursor: default; }
    .week-nav span {
      font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500;
      color: var(--white); min-width: 70px; text-align: center;
    }

    /* CONTENT */
    .content { max-width: 1320px; margin: 0 auto; padding: 28px 24px 56px; }

    /* HEALTH BANNER */
    .health-banner {
      border-radius: 10px; padding: 18px 24px; margin-bottom: 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      border: 1px solid;
    }
    .health-label { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 4px; }
    .health-pct { font-size: 40px; font-weight: 700; line-height: 1; }
    .health-sub { font-size: 13px; opacity: 0.8; }

    /* SECTION */
    .section-band { margin-bottom: 36px; }
    .section-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .section-title {
      font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
      padding-bottom: 6px; border-bottom: 1px solid;
    }
    .section-count {
      font-size: 12px; font-weight: 600; color: var(--muted);
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 10px; padding: 3px 9px;
    }
    .section-freq { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 12px; color: #E8F0FF; letter-spacing: 0.1em; text-transform: uppercase; }

    /* KPI GRID */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

    /* KPI CARD */
    .kc {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 18px 16px 22px; position: relative;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s; overflow: hidden;
    }
    .kc:hover { border-color: var(--border-h); background: var(--card-h); box-shadow: 0 0 20px rgba(0,194,203,0.06), inset 0 1px 0 rgba(0,194,203,0.08); }
    .kc::after {
      content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: 0; transition: opacity 0.2s;
    }
    .kc:hover::after { opacity: 0.5; }
    .kc-bar { position: absolute; left: 0; top: 12px; bottom: 12px; width: 2px; border-radius: 0 2px 2px 0; opacity: 0.7; }
    .kc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .kc-meta { flex: 1; min-width: 0; overflow: visible; }
    .kc-id {
      font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      word-break: break-word; margin-bottom: 4px;
    }
    .kc-target { font-family: 'DM Mono', monospace; font-size: 13px; color: rgba(200,215,240,0.85); letter-spacing: 0.04em; }
    .rag {
      display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 4px 10px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      white-space: nowrap; flex-shrink: 0;
    }
    .rag-dot { font-size: 8px; }
    .rg { color: var(--g); background: rgba(52,210,122,0.08); border: 1px solid rgba(52,210,122,0.2); }
    .ra { color: var(--a); background: rgba(240,180,41,0.08); border: 1px solid rgba(240,180,41,0.2); }
    .rr { color: var(--r); background: rgba(224,82,82,0.08); border: 1px solid rgba(224,82,82,0.2); }
    .rn { color: var(--gr); background: rgba(74,85,104,0.1); border: 1px solid rgba(74,85,104,0.2); }
    .kc-hero { font-size: 46px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--white); margin-bottom: 5px; }
    .kc-hero.dim { color: rgba(255,255,255,0.12); }
    .kc-sub { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.02em; }
    .bool-yes { color: var(--g); font-weight: 600; font-size: 22px; }
    .bool-no  { color: var(--r); font-weight: 600; font-size: 22px; }
    .mo-tag {
      display: inline-block; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase; color: rgba(107,128,160,0.45);
      border: 1px solid rgba(107,128,160,0.15); border-radius: 3px; padding: 2px 6px;
      margin-left: 6px; vertical-align: middle;
    }
    .kc-foot { display: flex; align-items: flex-end; justify-content: flex-end; margin-top: 4px; }
    .spark { opacity: 0.25; transition: opacity 0.2s; }
    .kc:hover .spark { opacity: 0.9; }

    /* STATE CARDS (loading / error) */
    .state-wrap { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
    .state-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 48px 36px; text-align: center; max-width: 460px; width: 100%;
    }
    .state-icon { font-size: 40px; margin-bottom: 16px; }
    .state-title { font-size: 20px; font-weight: 700; color: var(--white); margin-bottom: 8px; }
    .state-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
    .state-btn {
      display: inline-block; background: var(--cyan); color: #000; font-weight: 700;
      font-size: 13px; padding: 10px 24px; border-radius: var(--radius);
      text-decoration: none; transition: opacity 0.2s;
    }
    .state-btn:hover { opacity: 0.85; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-ring {
      width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--cyan);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ═══════════════════════════════════════════════════════════════
// CONFIG — edit these when URLs or targets change
// ═══════════════════════════════════════════════════════════════
const SHEET_CSV_URL  = "https://script.google.com/macros/s/AKfycbxCbAW3-MkKPfEUAVwde7CoS5ZD3si3Fv9IGPys-Tr8uSCn_qJGi-yADK04Ag8ozQZm/exec";
const SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/1WnyGb8BcpVVRDrUonoF0o17LKM9PoZ2A3mqflXleqI0/edit";

// Per-week targets
const TARGETS = {
  crmContacts: 2, outreachActions: 5, retailPartners: 1, linkedinContacts: 5,
  stakeholderMeetings: 2, partnershipConvos: 1, confirmedOpps: 1, featuresProgressed: 1,
  retailConvos: 1, retailTestOpps: 1, collabLeads: 1, networkingEvents: 1,
};

// Keys that accumulate week-on-week (multiplied by week count in month view)
const WEEKLY_KEYS = ['crmContacts','outreachActions','retailPartners','linkedinContacts'];

// ═══════════════════════════════════════════════════════════════
// SECTION / KPI DEFINITIONS
// ═══════════════════════════════════════════════════════════════
const SECTIONS = [
  { title:'Weekly Activity', freq:'Weekly', cv:'--s-blue', cr:'33,150,243', kpis:[
    { id:'P01', label:'CRM Contacts Added',           key:'crmContacts',      unit:'contacts' },
    { id:'P02', label:'Outreach & Follow-up Actions', key:'outreachActions',  unit:'actions'  },
    { id:'P03', label:'Retail Partners Researched',   key:'retailPartners',   unit:'partners' },
    { id:'P04', label:'LinkedIn Contacts Added',      key:'linkedinContacts', unit:'contacts' },
    { id:'P05', label:'All Contacts Logged 48hrs',    key:'allLogged',        yesNo:true      },
  ]},
  { title:'Partnerships & Stakeholders', freq:'Monthly', cv:'--s-purple', cr:'156,39,176', kpis:[
    { id:'P06', label:'Stakeholder Meetings',         key:'stakeholderMeetings', unit:'meetings', mo:true },
    { id:'P07', label:'New Partnership Convos',       key:'partnershipConvos',   unit:'convos',   mo:true },
    { id:'P08', label:'Confirmed Opps Secured',       key:'confirmedOpps',       unit:'opps',     mo:true },
    { id:'P09', label:'External Features / Speaking', key:'featuresProgressed',  unit:'opps',     mo:true },
  ]},
  { title:'Retail & Fashion', freq:'Monthly', cv:'--s-green', cr:'76,175,80', kpis:[
    { id:'P10', label:'New Active Retail Convos',   key:'retailConvos',   unit:'convos', mo:true },
    { id:'P11', label:'Retail Test Opp Progressed', key:'retailTestOpps', unit:'opps',   mo:true },
    { id:'P12', label:'Brand / Artist Collab Lead', key:'collabLeads',    unit:'leads',  mo:true },
  ]},
  { title:'External Engagement', freq:'Monthly', cv:'--s-orange', cr:'255,112,67', kpis:[
    { id:'P13', label:'Networking Events',       key:'networkingEvents', unit:'events', mo:true },
    { id:'P14', label:'LinkedIn Post Published', key:'linkedinPost',     yesNo:true,    mo:true },
  ]},
  { title:'Systems & CRM', freq:'Monthly', cv:'--s-grey', cr:'96,125,139', kpis:[
    { id:'P15', label:'Monthly Pipeline Update',     key:'pipelineUpdate',   yesNo:true, mo:true },
    { id:'P16', label:'Template Created / Improved', key:'templateImproved', yesNo:true, mo:true },
  ]},
];

// ═══════════════════════════════════════════════════════════════
// CSV PARSER
// ═══════════════════════════════════════════════════════════════
function parseCSV(text) {
  const rows = []; let row = [], cur = '', inQ = false;
  const t = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (inQ) {
      if (ch === '"') { if (t[i+1]==='"') { cur+='"'; i++; } else { inQ=false; } }
      else cur += ch;
    } else {
      if      (ch==='"')  { inQ=true; }
      else if (ch===',')  { row.push(cur.trim()); cur=''; }
      else if (ch==='\n') { row.push(cur.trim()); rows.push(row); row=[]; cur=''; }
      else cur += ch;
    }
  }
  row.push(cur.trim());
  if (row.some(c=>c!=='')) rows.push(row);
  return rows;
}

function toNum(v)  { return (v===''||v==null) ? 0 : (Number(v)||0); }
function toBool(v) { return v ? ['true','yes','1','y'].includes(String(v).toLowerCase().trim()) : false; }

function loadSheetData(text) {
  const rows = parseCSV(text);
  const dataRows = rows.slice(2).filter(r => r[0]?.trim());
  const weeks = [], data = {};
  dataRows.forEach(c => {
    const wk = c[0]?.trim(); if (!wk) return;
    weeks.push(wk);
    data[wk] = {
      crmContacts:         toNum(c[1]),   outreachActions:  toNum(c[2]),
      retailPartners:      toNum(c[3]),   linkedinContacts: toNum(c[4]),
      allLogged:           toBool(c[5]),
      stakeholderMeetings: toNum(c[6]),   partnershipConvos:  toNum(c[7]),
      confirmedOpps:       toNum(c[8]),   featuresProgressed: toNum(c[9]),
      retailConvos:        toNum(c[10]),  retailTestOpps:     toNum(c[11]),
      collabLeads:         toNum(c[12]),  networkingEvents:   toNum(c[13]),
      linkedinPost:        toBool(c[14]), pipelineUpdate:     toBool(c[15]),
      templateImproved:    toBool(c[16]),
    };
  });
  return { weeks, data };
}

// ═══════════════════════════════════════════════════════════════
// MONTH UTILITIES
// ═══════════════════════════════════════════════════════════════
const MON      = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function getMonthKey(lbl) {
  // Accepts "16 Jun", "16 June", "16 june" — always returns 3-letter key or null
  const p = lbl.trim().split(/\s+/);
  if (p.length < 2) return null;
  const m = p[p.length - 1]; // last token is the month
  if (MON.includes(m)) return m;
  const fi = MON_FULL.findIndex(n => n.toLowerCase() === m.toLowerCase());
  return fi >= 0 ? MON[fi] : null;
}

function getMonths(weeks) {
  const seen = new Set(), out = [];
  for (const w of weeks) { const m = getMonthKey(w); if (m && !seen.has(m)) { seen.add(m); out.push(m); } }
  return out;
}

function weeksForMonth(weeks, mk) { return weeks.filter(w => getMonthKey(w) === mk); }

function aggregateMonth(mWeeks, data) {
  const rows = mWeeks.map(w => data[w]).filter(Boolean);
  if (!rows.length) return null;
  const sum = k => rows.reduce((s,r) => s+(r[k]||0), 0);
  return {
    crmContacts:         sum('crmContacts'),
    outreachActions:     sum('outreachActions'),
    retailPartners:      sum('retailPartners'),
    linkedinContacts:    sum('linkedinContacts'),
    allLogged:           rows.every(r => r.allLogged),
    stakeholderMeetings: sum('stakeholderMeetings'),
    partnershipConvos:   sum('partnershipConvos'),
    confirmedOpps:       sum('confirmedOpps'),
    featuresProgressed:  sum('featuresProgressed'),
    retailConvos:        sum('retailConvos'),
    retailTestOpps:      sum('retailTestOpps'),
    collabLeads:         sum('collabLeads'),
    networkingEvents:    sum('networkingEvents'),
    linkedinPost:        rows.some(r => r.linkedinPost),
    pipelineUpdate:      rows.some(r => r.pipelineUpdate),
    templateImproved:    rows.some(r => r.templateImproved),
    _n:                  rows.length,
  };
}

function monthTargets(n) {
  return { ...TARGETS,
    crmContacts: TARGETS.crmContacts*n, outreachActions: TARGETS.outreachActions*n,
    retailPartners: TARGETS.retailPartners*n, linkedinContacts: TARGETS.linkedinContacts*n,
  };
}

// ═══════════════════════════════════════════════════════════════
// RAG + SPARKLINE HELPERS
// ═══════════════════════════════════════════════════════════════
function calcPct(actual, target) {
  if (target==null || actual==null) return null;
  return Math.min(Math.round((actual/target)*100), 150);
}
function getRag(p) { return p==null?'n': p>=85?'g': p>=60?'a':'r'; }
function ragLabel(r) {
  return r==='g'?'▲ On Track': r==='a'?'● Close': r==='r'?'▼ Off Track':'— No Data';
}

function sparkPoints(vals) {
  if (!vals || vals.length < 2) return null;
  const w=64,h=20, mn=Math.min(...vals), mx=Math.max(...vals), rng=mx-mn||1;
  return vals.map((v,i)=>`${Math.round(i/(vals.length-1)*w)},${Math.round(h-((v-mn)/rng)*(h-2)+1)}`).join(' ');
}

// ═══════════════════════════════════════════════════════════════
// KPI CARD
// ═══════════════════════════════════════════════════════════════
function KpiCard({ kpi, d, targets, cv, sparkVals, view }) {
  const { id, label, key, unit, yesNo, mo } = kpi;
  const actual  = d ? d[key] : null;
  const target  = targets[key];
  const isMonth = view === 'month';

  const tgtLbl = yesNo
    ? `target: yes / ${mo ? 'month' : 'week'}`
    : WEEKLY_KEYS.includes(key) && isMonth
      ? `target: ${target} / month`
      : `target: ${target}${unit ? ' '+unit : ''} / ${mo ? 'month' : 'week'}`;

  let rc, rl;
  if (yesNo) {
    rc = actual ? 'rg' : 'rr';
    rl = actual ? '▲ On Track' : '▼ Off Track';
  } else {
    const r = getRag(calcPct(actual, target));
    rc = 'r'+r; rl = ragLabel(r);
  }

  let hero, sub;
  if (yesNo) {
    hero = actual
      ? <div style={{fontSize:'20px',paddingTop:'6px',marginBottom:'6px'}}><span className="bool-yes">✓ Completed</span></div>
      : <div style={{fontSize:'20px',paddingTop:'6px',marginBottom:'6px'}}><span className="bool-no">✗ Missed</span></div>;
    sub = actual ? (mo?'done this month':'done this week') : (mo?'not done this month':'not done this week');
  } else if (actual == null) {
    hero = <div className="kc-hero dim">—</div>;
    sub  = 'no data entered';
  } else {
    hero = <div className="kc-hero">{actual}</div>;
    sub  = unit ? `${unit} ${isMonth?'this month':'this week'}` : '';
  }

  const pts = !yesNo && sparkVals ? sparkPoints(sparkVals) : null;

  return (
    <div className="kc">
      <div className="kc-bar" style={{background:`var(${cv})`}}></div>
      <div className="kc-top">
        <div className="kc-meta">
          <div className="kc-id">{id} · {label}{mo && <span className="mo-tag">mo</span>}</div>
          <div className="kc-target">{tgtLbl}</div>
        </div>
        <div className={`rag ${rc}`}><span className="rag-dot">●</span> {rl}</div>
      </div>
      {hero}
      {sub && <div className="kc-sub">{sub}</div>}
      {pts && (
        <div className="kc-foot">
          <svg className="spark" width="64" height="20" viewBox="0 0 64 20">
            <polyline points={pts} fill="none" stroke={`var(${cv})`} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
          </svg>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// SECTION BAND
// ═══════════════════════════════════════════════════════════════
function SectionBand({ sec, d, targets, allData, weeks, view }) {
  if (!d) return null;
  return (
    <div className="section-band">
      <div className="section-hdr">
        <div className="section-title" style={{borderColor:`rgba(${sec.cr},0.4)`,color:`rgba(${sec.cr},0.85)`}}>{sec.title}</div>
        <div className="section-count">{sec.kpis.length} KPIs</div>
        <div className="section-freq">{sec.freq}</div>
      </div>
      <div className="kpi-grid">
        {sec.kpis.map(kpi => {
          const sv = !kpi.yesNo && weeks.length >= 2
            ? weeks.slice(-8).map(w => allData[w]?.[kpi.key] ?? 0)
            : null;
          return <KpiCard key={kpi.id} kpi={kpi} d={d} targets={targets} cv={sec.cv} sparkVals={sv} view={view} />;
        })}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// HEALTH BANNER (week view only)
// ═══════════════════════════════════════════════════════════════
function HealthBanner({ d, targets }) {
  if (!d) return null;
  const checks = [
    d.crmContacts>=targets.crmContacts, d.outreachActions>=targets.outreachActions,
    d.retailPartners>=targets.retailPartners, d.linkedinContacts>=targets.linkedinContacts,
    d.allLogged,
  ];
  const met=checks.filter(Boolean).length, pct=Math.round((met/checks.length)*100);
  const col  = pct>=85?'var(--g)':pct>=60?'var(--a)':'var(--r)';
  const bcol = pct>=85?'rgba(52,210,122,0.2)':pct>=60?'rgba(240,180,41,0.2)':'rgba(224,82,82,0.2)';
  const bg   = pct>=85?'rgba(52,210,122,0.06)':pct>=60?'rgba(240,180,41,0.06)':'rgba(224,82,82,0.06)';
  return (
    <div className="health-banner" style={{background:bg,borderColor:bcol,color:col}}>
      <div>
        <div className="health-label">Weekly Activity Health</div>
        <div className="health-pct">{pct}%</div>
        <div className="health-sub">{met} of {checks.length} weekly targets hit</div>
      </div>
      <svg viewBox="0 0 36 36" style={{width:'64px',height:'64px',transform:'rotate(-90deg)',flexShrink:0}}>
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth="3.5"/>
        <circle cx="18" cy="18" r="15.9" fill="none" strokeWidth="3.5"
          strokeDasharray={`${pct} ${100-pct}`} strokeLinecap="round" stroke={col}/>
      </svg>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// STAT CHIPS
// ═══════════════════════════════════════════════════════════════
function StatChips({ d, targets }) {
  if (!d) return null;
  const cnt = {g:0,a:0,r:0,n:0};
  SECTIONS.forEach(sec => sec.kpis.forEach(kpi => {
    const actual = d[kpi.key];
    const r = kpi.yesNo ? (actual?'g':'r') : getRag(calcPct(actual, targets[kpi.key]));
    cnt[r]++;
  }));
  return (
    <div className="stat-row">
      <div className="stat-chip"><div className="pip" style={{background:'var(--g)',boxShadow:'0 0 4px var(--g)'}}></div><b>{cnt.g}</b>&nbsp;On Track</div>
      <div className="stat-chip"><div className="pip" style={{background:'var(--a)',boxShadow:'0 0 4px var(--a)'}}></div><b>{cnt.a}</b>&nbsp;Close</div>
      <div className="stat-chip"><div className="pip" style={{background:'var(--r)',boxShadow:'0 0 4px var(--r)'}}></div><b>{cnt.r}</b>&nbsp;Off Track</div>
      {cnt.n>0 && <div className="stat-chip"><div className="pip" style={{background:'var(--gr)'}}></div><b>{cnt.n}</b>&nbsp;No Data</div>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════
function App() {
  const [weeks,  setWeeks]  = useState([]);
  const [data,   setData]   = useState({});
  const [week,   setWeek]   = useState(null);
  const [month,  setMonth]  = useState(null);
  const [view,   setView]   = useState('week');
  const [status, setStatus] = useState('loading');

  useEffect(() => {
    if (!SHEET_CSV_URL) { setStatus('nourl'); return; }
    fetch(SHEET_CSV_URL)
      .then(r => { if (!r.ok) throw new Error('http'); return r.text(); })
      .then(text => {
        const { weeks:w, data:d } = loadSheetData(text);
        if (!w.length) throw new Error('empty');
        setWeeks(w); setData(d);
        const MIDX = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
        const today = new Date(); today.setHours(0,0,0,0);
        const toDate = lbl => {
          const p = lbl.trim().split(' '); if (p.length!==2) return null;
          const yr = today.getFullYear();
          const dt = new Date(yr, MIDX[p[1]]??0, parseInt(p[0],10));
          if (dt-today > 183*86400000) dt.setFullYear(yr-1);
          return dt;
        };
        let best = w[0];
        for (const wk of w) { const dt=toDate(wk); if (dt && dt<=today) best=wk; }
        setWeek(best);
        setMonth(getMonthKey(best));
        setStatus('ok');
      })
      .catch(e => setStatus(e.message==='empty'?'empty':'error'));
  }, []);

  const months = useMemo(() => getMonths(weeks), [weeks]);

  const currentData = useMemo(() => {
    if (view==='week') return week ? data[week] : null;
    if (view==='month' && month) return aggregateMonth(weeksForMonth(weeks, month), data);
    return null;
  }, [view, week, month, weeks, data]);

  const targets = useMemo(() => (
    view==='month' && currentData?._n ? monthTargets(currentData._n) : TARGETS
  ), [view, currentData]);

  const wIdx = weeks.indexOf(week),  mIdx = months.indexOf(month);
  function prevWeek()  { if (wIdx>0)              setWeek(weeks[wIdx-1]);   }
  function nextWeek()  { if (wIdx<weeks.length-1)  setWeek(weeks[wIdx+1]);   }
  function prevMonth() { if (mIdx>0)              setMonth(months[mIdx-1]); }
  function nextMonth() { if (mIdx<months.length-1) setMonth(months[mIdx+1]); }
  const onPrev  = view==='week' ? prevWeek  : prevMonth;
  const onNext  = view==='week' ? nextWeek  : nextMonth;
  const canPrev = view==='week' ? wIdx>0              : mIdx>0;
  const canNext = view==='week' ? wIdx<weeks.length-1 : mIdx<months.length-1;
  const navLbl  = view==='week' ? week                : month;

  const h1  = view==='week'  ? `Week of ${week||'…'}` : `${month||'…'} — Monthly View`;
  const sub = view==='week'
    ? `w/c ${week||''} · 16 metrics across 5 sections`
    : `${currentData?._n??'?'} weeks of data · 16 metrics · aggregated totals`;

  if (status==='loading') return (
    <div className="state-wrap">
      <div className="state-card">
        <div className="spin-ring"></div>
        <div className="state-title">Loading…</div>
        <div className="state-sub">Fetching from Google Sheets</div>
      </div>
    </div>
  );
  if (status==='nourl') return (
    <div className="state-wrap">
      <div className="state-card">
        <div className="state-icon">📊</div>
        <div className="state-title">Sheet Not Connected</div>
        <div className="state-sub">Paste your Apps Script URL into SHEET_CSV_URL at the top of this file.</div>
      </div>
    </div>
  );
  if (status==='error') return (
    <div className="state-wrap">
      <div className="state-card">
        <div className="state-icon">⚠️</div>
        <div className="state-title">Connection Error</div>
        <div className="state-sub">Couldn't reach the Google Sheet. Check your Apps Script URL is deployed as a public web app.</div>
        <a href={SHEET_EDIT_URL} target="_blank" rel="noopener noreferrer" className="state-btn">Open Google Sheet →</a>
      </div>
    </div>
  );
  if (status==='empty') return (
    <div className="state-wrap">
      <div className="state-card">
        <div className="state-icon">📋</div>
        <div className="state-title">No Data Yet</div>
        <div className="state-sub">Sheet connected — add at least one week row and refresh.</div>
        <a href={SHEET_EDIT_URL} target="_blank" rel="noopener noreferrer" className="state-btn">Open Sheet →</a>
      </div>
    </div>
  );

  return (
    <>
      <header className="topbar">
        <div style={{display:'flex',alignItems:'center',gap:'14px'}}>
          <div className="wordmark">TRASH <em>|</em> G✕NG</div>
          <div className="topbar-pill">
            <div className="status-dot"></div>
            <span>Live</span> · Partnerships
          </div>
        </div>
        <div className="topbar-right">
          <a href={SHEET_EDIT_URL} target="_blank" rel="noopener noreferrer" className="icon-btn" title="Open Google Sheet">📊</a>
        </div>
      </header>

      <div className="page-header">
        <div className="header-left">
          <div className="eyebrow">Partnerships KPI</div>
          <h1 className="page-h1">{h1}</h1>
          <div className="page-sub">{sub}</div>
          <div className="person-row">
            <div className="avatar">JB</div>
            <div>
              <div className="person-name">John Burley</div>
              <div className="person-role">Partnerships & Business Development · 3 days/wk</div>
            </div>
          </div>
          <StatChips d={currentData} targets={targets} />
        </div>
        <div className="header-right">
          <div className="seg-toggle">
            <button className={`seg-btn${view==='week'?' active':''}`} onClick={()=>setView('week')}>Week</button>
            <button className={`seg-btn${view==='month'?' active':''}`} onClick={()=>setView('month')}>Month</button>
          </div>
          {weeks.length>0 && (
            <div className="week-nav">
              <button onClick={onPrev} disabled={!canPrev}>‹</button>
              <span>{navLbl||'…'}</span>
              <button onClick={onNext} disabled={!canNext}>›</button>
            </div>
          )}
        </div>
      </div>

      <main className="content">
        {view==='week' && <HealthBanner d={currentData} targets={targets} />}
        {SECTIONS.map(sec => (
          <SectionBand key={sec.title} sec={sec} d={currentData} targets={targets}
            allData={data} weeks={weeks} view={view} />
        ))}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
